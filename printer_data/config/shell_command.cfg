[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world
[gcode_shell_command update_klipper]
command: /home/biqu/mcu_update.sh
timeout: 900
verbose: True

[gcode_macro UPDATE_KLIPPER]
description: Kontrola a aktualizace Klipperu a MCU
gcode:
    RUN_SHELL_COMMAND CMD=update_klipper
